<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced date</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff007f;
            --neon-purple: #b000ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #030305;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Fast-moving neon background container */
        .neon-bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            /* Quick panning grid overlay */
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 127, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 3s linear infinite;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            /* Speed cranked up to 1.5s - 2.5s */
            animation: franticPulse 2s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 450px;
            height: 450px;
            background: var(--neon-cyan);
            top: -20%;
            left: -10%;
            animation-duration: 1.8s;
        }

        .orb-2 {
            width: 550px;
            height: 550px;
            background: var(--neon-pink);
            bottom: -20%;
            right: -10%;
            animation-duration: 2.2s;
            animation-delay: -0.5s;
        }

        .orb-3 {
            width: 350px;
            height: 350px;
            background: var(--neon-purple);
            top: 40%;
            left: 30%;
            animation-duration: 1.4s;
            animation-delay: -1s;
        }

        /* Fast erratic background movement */
        @keyframes franticPulse {
            0% { 
                transform: scale(0.8) translate(-30px, -20px); 
                opacity: 0.3; 
            }
            50% { 
                transform: scale(1.3) translate(40px, 30px); 
                opacity: 0.6; 
            }
            100% { 
                transform: scale(1) translate(-20px, 40px); 
                opacity: 0.4; 
            }
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        .date-container {
            padding: 3rem 4rem;
            background: rgba(10, 10, 15, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9),
                        0 0 40px rgba(0, 243, 255, 0.2);
            text-align: center;
        }

        #date-display {
            font-size: 2.2rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            margin: 0;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 
                         0 0 30px rgba(0, 243, 255, 0.3);
        }

        .neon-accent {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan), 
                         0 0 25px var(--neon-cyan),
                         0 0 50px var(--neon-cyan);
        }
    </style>
</head>
<body>

    <!-- Fast-paced Neon Background Elements -->
    <div class="neon-bg-glow">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="date-container">
        <h1 id="date-display">Loading...</h1>
    </div>

    <script>
        function getOrdinalSuffix(day) {
            if (day > 3 && day < 21) return 'th';
            switch (day % 10) {
                case 1:  return "st";
                case 2:  return "nd";
                case 3:  return "rd";
                default: return "th";
            }
        }

        function renderDate() {
            const now = new Date();
            const daysOfWeek = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

            const dayName = daysOfWeek[now.getDay()];
            const dayNum = now.getDate();
            const monthName = months[now.getMonth()];
            const year = now.getFullYear();

            const formattedDate = `${dayName}, <span class="neon-accent">${dayNum}${getOrdinalSuffix(dayNum)}</span> ${monthName} ${year}`;
            
            document.getElementById("date-display").innerHTML = formattedDate;
        }

        renderDate();
    </script>

</body>
</html>
